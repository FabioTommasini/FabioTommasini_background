<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Projects - My First Build</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(10, 20, 50, 0.6), rgba(10, 20, 50, 0.6)),
                  url('https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=1920&q=80')
                  center / cover no-repeat fixed;
      text-align: center;
      padding: 3rem 1.5rem;
      box-sizing: border-box;
      color: #eaf1ff;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, p, a {
      animation: fadeInUp 0.9s ease-out both;
    }

    h1 {
      color: #7db3ff;
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
    }

    p {
      max-width: 560px;
      font-size: 1.15rem;
      line-height: 1.7;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);
      animation-delay: 0.2s;
    }

    a.back {
      display: inline-block;
      margin-top: 2rem;
      color: #b7cdfa;
      text-decoration: none;
      font-size: 1rem;
      border: 1px solid #b7cdfa;
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      transition: background 0.3s ease, color 0.3s ease, transform 0.3s ease;
      animation-delay: 0.4s;
    }

    a.back:hover {
      background: #b7cdfa;
      color: #10192e;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

</html>
